<script>

(function () {

const patch = (el) => {
    if (!(el instanceof HTMLInputElement)) return;
    if (el.id !== "egui_text_agent") return;

    el.setAttribute("autocapitalize", "none");
    el.setAttribute("autocorrect", "off");
    el.setAttribute("spellcheck", "false");

    el.removeAttribute("readonly");
    el.removeAttribute("disabled");
};
    <!-- const patch = (el) => { -->
        <!-- if (!(el instanceof HTMLInputElement)) return; -->

        <!-- if (el.id !== "egui_text_agent") return; -->

        <!-- el.autocapitalize = "none"; -->
        <!-- el.setAttribute("autocapitalize", "none"); -->

        <!-- el.autocorrect = "off"; -->
        <!-- el.setAttribute("autocorrect", "off"); -->

        <!-- el.spellcheck = false; -->
        <!-- Deu certo.. -->
        <!-- console.log("Patched egui_text_agent"); -->
    <!-- }; -->

    new MutationObserver((mutations) => {
        for (const mutation of mutations) {
            for (const node of mutation.addedNodes) {
                patch(node);

                if (node.querySelectorAll) {
                    node.querySelectorAll("input").forEach(patch);
                }
            }
        }
    }).observe(document.documentElement, {
        childList: true,
        subtree: true,
    });

document.addEventListener("focusin", (event) => {
    if (event.target.id === "egui_text_agent") {
        console.log("egui: foco recebido");
    }
});

document.addEventListener("touchend", (event) => {
    if (event.target.id === "egui_text_agent") {
        console.log("egui: toque no campo");
    }
}, true);    const existing = document.getElementById("egui_text_agent");
    if (existing) {
        patch(existing);
    }
})();

const APP_VERSION = "0.1.5";

if (localStorage.getItem("app_version") !== APP_VERSION) {
    localStorage.clear();
    localStorage.setItem("app_version", APP_VERSION);
}
</script>
